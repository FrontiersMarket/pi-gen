[Uploader]
# Directory to monitor for files to upload
directory = ./test-data
# Optional: Backup directory to use if primary directory is full
# Leave empty to disable backup functionality
backup_directory = /path/to/backup
# Minimum free space in GB before switching to backup directory
# Set to 0 to disable backup functionality
min_free_space_gb = 10
# GCP bucket name (without gs:// prefix)
bucket = your-bucket-name
# Time in seconds to wait after file modification before uploading
file_age_threshold = 60
# Sleep interval between directory scans
sleep_interval = 10
# Path to your GCP service account credentials JSON file
credentials_file = /path/to/your-service-account.json

# Upload retry settings for low internet conditions
# Number of times to retry failed uploads
max_retries = 10
# Upload chunk size in megabytes (smaller chunks for unstable connections)
chunk_size_mb = 1
# Upload timeout in seconds (2 hours for large files)
upload_timeout = 7200
# Number of retries for transient errors
retry_max = 10
# Initial delay between retries (seconds)
retry_delay = 5
# Maximum delay between retries (seconds)
retry_max_delay = 30

# Daily report settings
# Enable daily upload report generation
daily_report_enabled = true
# Directory to store reports (will be created if it doesn't exist)
report_directory = ./reports
# Time to generate report (24-hour format, local timezone)
report_time = 23:59
# Generate early report if no activity for this many hours
inactivity_threshold = 2
# Report filename format (strftime format)
report_filename_format = upload_report_%%Y%%m%%d.json
# Upload reports to this subdirectory in the bucket
report_upload_prefix = reports

# You can have multiple streamer sections for different cameras
# Use the format [Streamer.NAME] where NAME is a unique identifier

[Streamer.front]
# Unique prefix for this stream's files
file_prefix = front_cam
# RTSP URL in format: rtsp://username:password@ip:port/path
rtsp_url = rtsp://username:password@camera-ip:554/path
# Directory where video segments will be saved
output_dir = ./test-data
# Segment duration in seconds (default: 600 = 10 minutes)
segment_time = 600
# Sleep interval before restarting stream if it fails
sleep_interval = 5

# FFmpeg Version and Mode Settings
# Override detected FFmpeg version (optional)
# ffmpeg_version = 5.0
# Force legacy mode for older FFmpeg versions or specific compatibility
# force_legacy_mode = false

# Connection Settings
# Socket timeout in seconds (default: 5)
socket_timeout = 5
# Maximum retry interval in seconds (default: 60)
max_retry_interval = 60
# Transport protocol: tcp or udp (default: tcp)
transport_protocol = tcp
# Maximum number of retries before giving up (default: 0 = infinite)
max_retries = 0

# Reconnection Settings
# Initial delay before reconnecting in seconds (default: 5)
reconnect_delay_seconds = 5
# Maximum delay between reconnection attempts in seconds (default: 30)
max_reconnect_delay_seconds = 30

# Segment Management
# Maximum size of a single segment in megabytes (default: 500)
max_segment_size_mb = 500

[Streamer.back]
file_prefix = back_cam
rtsp_url = rtsp://username:password@camera-ip:554/path
output_dir = ./test-data
segment_time = 600
sleep_interval = 5
